name: EasyNutri Web CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify Spotless Code Formatting
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Domain Module Unit Tests
        run: ./gradlew :domain:test --stacktrace

      - name: Run Tools Module Schema & CLI Tests
        run: ./gradlew :tools:test --stacktrace

      - name: Run Server Module Web & API Tests
        run: ./gradlew :server:test --stacktrace

      - name: Package Executable Web Application JAR
        run: ./gradlew :server:bootJar --stacktrace

      - name: Upload Server Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easynutri-server-bootjar
          path: server/build/libs/server-*.jar
