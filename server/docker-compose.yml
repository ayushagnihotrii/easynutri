version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: easynutri-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-easynutri}
      POSTGRES_USER: ${DB_USER:-easynutri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password must be set in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-easynutri} -d ${DB_NAME:-easynutri}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: easynutri-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-easynutri}
      DB_USERNAME: ${DB_USER:-easynutri}
      DB_PASSWORD: ${DB_PASSWORD:?Database password must be set in .env}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

