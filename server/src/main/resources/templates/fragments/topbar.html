<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<header class="app-header" th:fragment="topbar(username)">
  <div class="header-left">
    <button class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="header-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--color-text-light);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" placeholder="Search foods, recipes, macros..." aria-label="Search">
    </div>
  </div>

  <div class="header-right">
    <!-- PWA Online / Offline Sync Badge -->
    <span id="networkSyncBadge" class="badge badge-mint" title="PWA Offline Sync Active">
      <span style="width:8px;height:8px;border-radius:50%;background:#237A57;display:inline-block;margin-right:4px;"></span> Online
    </span>

    <!-- Sensitive-User Mode Toggle (Feature 33) -->
    <button id="sensitiveToggleBtn" class="header-btn sensitive-toggle-btn" onclick="toggleSensitiveMode()" title="Toggle Sensitive-User Mode (Disguises calorie & weight numbers)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span style="font-size:0.8125rem;">Sensitive Mode</span>
    </button>

    <!-- Theme Switcher -->
    <button class="header-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <!-- User Profile Dropdown / Sign-in -->
    <div class="user-profile-menu">
      <div class="user-avatar" th:text="${username != null ? username.substring(0, 1).toUpperCase() : 'U'}">U</div>
      <span style="font-size:0.875rem;font-weight:600;" th:text="${username}">Demo User</span>
      <form th:action="@{/logout}" method="post" style="display:inline;margin-left:4px;">
        <button type="submit" class="header-btn" style="height:32px;padding:0 8px;font-size:0.75rem;" title="Sign out">
          Sign out
        </button>
      </form>
    </div>
  </div>
</header>
</body>
</html>
