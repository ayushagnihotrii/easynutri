<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, activeNav, contentBody)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EasyNutri — Clinical nutrition tracking, smart pantry suggestion, and meal planning platform.">
  <meta name="theme-color" content="#237A57">
  
  <!-- Spring CSRF Meta Tags for PWA Offline Sync -->
  <meta name="_csrf" th:content="${_csrf?.token}" />
  <meta name="_csrf_header" th:content="${_csrf?.headerName}" />

  <title th:text="${pageTitle != null ? pageTitle + ' — EasyNutri' : 'EasyNutri — Clinical Nutrition & Smart Pantry'}">EasyNutri</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <!-- Fonts (Raca Studio Style: Poppins & Architectural Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Desktop & Tablet Sidebar -->
  <aside th:replace="~{fragments/sidebar :: sidebar(${activeNav})}"></aside>

  <!-- Main Content Area -->
  <div class="app-main">
    <!-- Topbar Header -->
    <header th:replace="~{fragments/topbar :: topbar(${username})}"></header>

    <!-- Page Content Slot -->
    <main class="app-content">
      <div th:replace="${contentBody}">
        <!-- Page specific content will be injected here -->
      </div>
    </main>

    <!-- Clinical & Attribution Footer (Raca Studio Editorial Line) -->
    <footer class="app-footer" style="padding: 24px 32px; border-top: 1px solid var(--raca-line); font-size: 0.75rem; color: var(--darkgrey); background: var(--color-surface); margin-top: auto;">
      <div style="max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
        <div>
          <span>EasyNutri &copy; 2026 — Evidence-Based Clinical Nutrition & Wellness. Sourced from ICMR-NIN IFCT 2017 & USDA FoodData Central.</span>
          <span style="display: block; margin-top: 4px; color: var(--color-text-muted);">Not a medical device. For emergencies, dial 112 / 911 immediately.</span>
        </div>
        <div style="display: flex; gap: 20px;">
          <a th:href="@{/attribution}" style="color: var(--color-text-main); text-decoration: none; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='var(--racablue)'" onmouseout="this.style.color='var(--color-text-main)'">Data Provenance & Disclaimers</a>
          <a th:href="@{/settings}" style="color: var(--color-text-main); text-decoration: none; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='var(--racablue)'" onmouseout="this.style.color='var(--color-text-main)'">Privacy & Data Rights</a>
        </div>
      </div>
    </footer>
  </div>
</div>

<!-- Mobile Bottom Navigation -->
<nav th:replace="~{fragments/mobile-nav :: mobileNav(${activeNav})}"></nav>

<!-- JavaScript Libraries & PWA Handler -->
<script src="/js/app.js"></script>
<script src="/js/pwa.js"></script>
<script src="/js/offline-db.js"></script>
<script src="/js/offline-sync.js"></script>

</body>
</html>
