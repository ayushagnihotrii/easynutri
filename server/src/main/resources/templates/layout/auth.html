<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="authLayout(pageTitle, contentBody)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e0e10">
  <title th:text="${pageTitle + ' — EasyNutri'}">Authentication — EasyNutri</title>

  <!-- Fonts (Raca Studio Style: Poppins & Architectural Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-24);
      background-color: var(--raca-bg);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: var(--space-40) var(--space-32);
      border-radius: var(--radius-sm);
      background-color: var(--color-surface);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--raca-line);
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-32);
    }
    .auth-brand-logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: 0.8125rem;
      color: var(--darkgrey);
      font-weight: 400;
    }
    .form-group {
      margin-bottom: var(--space-20);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-text-main);
      letter-spacing: -0.01em;
    }
    .form-control {
      width: 100%;
      height: 42px;
      padding: 0 var(--space-12);
      border: 1px solid var(--silver);
      border-radius: var(--radius-xs);
      background-color: var(--color-surface);
      color: var(--color-text-main);
      font-size: 0.875rem;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .form-control:focus {
      outline: none;
      border-color: var(--racablue);
      box-shadow: 0 0 0 2px var(--racablue-glow);
    }
    .form-error {
      font-size: 0.75rem;
      color: var(--color-danger);
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div style="width:36px;height:36px;background:var(--black);color:#fff;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;margin-bottom:12px;">E</div>
      <div class="auth-brand-logo">EasyNutri</div>
      <p class="auth-subtitle" th:text="${pageTitle}">Clinical Nutrition & Meal Planning</p>
    </div>

    <div th:replace="${contentBody}"></div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
