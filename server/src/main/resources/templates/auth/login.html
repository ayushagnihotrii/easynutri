<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: authLayout('Sign In to EasyNutri', ~{::#loginFormSection})}">
<head></head>
<body>

<div id="loginFormSection">
  <!-- Error or Logout Feedback -->
  <div th:if="${errorMessage}" class="card" style="padding:12px 16px;background-color:var(--color-danger-bg);color:var(--color-danger);margin-bottom:16px;font-size:0.875rem;border-radius:8px;">
    <span th:text="${errorMessage}"></span>
  </div>
  <div th:if="${successMessage}" class="card" style="padding:12px 16px;background-color:var(--color-success-bg);color:var(--color-success);margin-bottom:16px;font-size:0.875rem;border-radius:8px;">
    <span th:text="${successMessage}"></span>
  </div>
  <div th:if="${param.registered}" class="card" style="padding:12px 16px;background-color:var(--color-success-bg);color:var(--color-success);margin-bottom:16px;font-size:0.875rem;border-radius:8px;">
    Account created successfully! Please sign in below.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="e.g. demo" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;height:44px;margin-top:8px;">
      Sign In
    </button>
  </form>

  <!-- Demo Account Quick Credentials Helper -->
  <div style="margin-top:20px;padding:12px;background:var(--color-mint);border-radius:var(--radius-md);font-size:0.8125rem;text-align:center;">
    <div style="font-weight:600;color:var(--color-primary);margin-bottom:4px;">Quick Demo Access</div>
    <div style="color:var(--color-text-main);">Username: <code>demo</code> | Password: <code>Password123!</code></div>
    <button type="button" class="btn btn-secondary" style="margin-top:8px;padding:4px 12px;font-size:0.75rem;" onclick="document.getElementById('username').value='demo';document.getElementById('password').value='Password123!';">
      Auto-fill Demo Credentials
    </button>
  </div>

  <div style="margin-top:20px;text-align:center;font-size:0.875rem;color:var(--color-text-muted);">
    Don't have an account? <a th:href="@{/register}" style="font-weight:600;">Create one now</a>
  </div>
</div>

</body>
</html>
