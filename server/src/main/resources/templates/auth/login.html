<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — EasyNutri</title>
  <!-- Fonts (Raca Studio Style: Poppins & Architectural Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--color-background);">

<div class="card" style="width:100%;max-width:420px;margin:24px;padding:36px 32px;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);border:1px solid var(--raca-line);">
  <div style="text-align:center;margin-bottom:28px;">
    <div style="width:36px;height:36px;background:var(--black);color:#fff;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;margin-bottom:12px;">E</div>
    <h1 style="color:var(--color-text-main);font-size:1.4rem;font-weight:700;letter-spacing:-0.04em;text-transform:uppercase;margin-bottom:4px;">EasyNutri</h1>
    <p style="color:var(--color-text-muted);font-size:0.8125rem;">Sign in to your nutrition workspace</p>
  </div>

  <div th:if="${param.error}" class="alert alert-danger" style="margin-bottom:16px;">
    Invalid username or password. Please try again.
  </div>

  <div th:if="${param.logout}" class="alert alert-success" style="margin-bottom:16px;">
    You have been successfully signed out.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="username" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;height:44px;margin-top:8px;">
      Sign In
    </button>
  </form>

  <!-- Demo Account Quick Credentials Helper (Development & Test Environments Only) -->
  <div th:if="${!#arrays.contains(@environment.getActiveProfiles(), 'prod')}"
       style="margin-top:24px;padding:14px;background:var(--color-surface-hover);border:1px solid var(--raca-line);border-radius:var(--radius-xs);font-size:0.8125rem;text-align:center;">
    <div style="font-weight:600;color:var(--color-text-main);margin-bottom:4px;letter-spacing:-0.01em;">Quick Demo Access (Development Mode)</div>
    <div style="color:var(--darkgrey);margin-bottom:6px;">Username: <code style="color:var(--color-text-main);background:var(--color-surface);padding:2px 6px;border:1px solid var(--raca-line);border-radius:2px;">demo</code> | Password: <code style="color:var(--color-text-main);background:var(--color-surface);padding:2px 6px;border:1px solid var(--raca-line);border-radius:2px;">DevDemoPass2026!#</code></div>
    <button type="button" class="btn btn-outline" style="margin-top:6px;padding:4px 14px;font-size:0.75rem;" onclick="document.getElementById('username').value='demo';document.getElementById('password').value='DevDemoPass2026!#';">
      Auto-fill Demo Credentials
    </button>
  </div>

  <div style="margin-top:20px;text-align:center;font-size:0.875rem;color:var(--color-text-muted);">
    Don't have an account? <a th:href="@{/register}" style="font-weight:600;">Create one now</a>
  </div>
</div>

</body>
</html>
