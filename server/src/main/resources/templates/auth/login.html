<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - EasyNutri</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--color-bg-base);">

<div class="card" style="width:100%;max-width:400px;margin:24px;">
  <div style="text-align:center;margin-bottom:24px;">
    <h1 style="color:var(--color-primary);font-size:1.75rem;margin-bottom:8px;">EasyNutri</h1>
    <p style="color:var(--color-text-muted);font-size:0.875rem;">Sign in to your nutrition workspace</p>
  </div>

  <div th:if="${param.error}" class="alert alert-danger" style="margin-bottom:16px;">
    Invalid username or password. Please try again.
  </div>

  <div th:if="${param.logout}" class="alert alert-success" style="margin-bottom:16px;">
    You have been successfully signed out.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="username" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;height:44px;margin-top:8px;">
      Sign In
    </button>
  </form>

  <!-- Demo Account Quick Credentials Helper (Development & Test Environments Only) -->
  <div th:if="${!#arrays.contains(@environment.getActiveProfiles(), 'prod')}"
       style="margin-top:20px;padding:12px;background:var(--color-mint);border-radius:var(--radius-md);font-size:0.8125rem;text-align:center;">
    <div style="font-weight:600;color:var(--color-primary);margin-bottom:4px;">Quick Demo Access (Development Mode)</div>
    <div style="color:var(--color-text-main);">Username: <code>demo</code> | Password: <code>DevDemoPass2026!#</code></div>
    <button type="button" class="btn btn-secondary" style="margin-top:8px;padding:4px 12px;font-size:0.75rem;" onclick="document.getElementById('username').value='demo';document.getElementById('password').value='DevDemoPass2026!#';">
      Auto-fill Demo Credentials
    </button>
  </div>

  <div style="margin-top:20px;text-align:center;font-size:0.875rem;color:var(--color-text-muted);">
    Don't have an account? <a th:href="@{/register}" style="font-weight:600;">Create one now</a>
  </div>
</div>

</body>
</html>
