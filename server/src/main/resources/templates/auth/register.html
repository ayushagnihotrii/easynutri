<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: authLayout('Create EasyNutri Account', ~{::#registerFormSection})}">
<head></head>
<body>

<div id="registerFormSection">
  <div th:if="${registrationError}" class="card" style="padding:12px 16px;background-color:var(--color-danger-bg);color:var(--color-danger);margin-bottom:16px;font-size:0.875rem;border-radius:8px;">
    <span th:text="${registrationError}"></span>
  </div>

  <form th:action="@{/register}" th:object="${registerForm}" method="post">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Choose a username (min 3 chars)" required>
      <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>

    <div class="form-group">
      <label class="form-label" for="fullName">Full Name</label>
      <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Alex Johnson">
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@domain.com" required>
      <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="At least 8 characters" required minlength="8">
      <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;height:44px;margin-top:8px;">
      Create Account
    </button>
  </form>

  <div style="margin-top:20px;text-align:center;font-size:0.875rem;color:var(--color-text-muted);">
    Already have an account? <a th:href="@{/login}" style="font-weight:600;">Sign in</a>
  </div>
</div>

</body>
</html>
