pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'easynutri'

include ':domain', ':server', ':tools'
if (!"true".equalsIgnoreCase(System.getenv("BACKEND_BUILD_ONLY")) && file('apps/android').exists()) {
    include ':android'
    project(':android').projectDir = file('apps/android')
}
