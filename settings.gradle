pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'easynutri'

if (System.getenv("BACKEND_BUILD_ONLY") == "true") {
    include ':domain', ':server', ':tools'
} else {
    include ':app', ':domain', ':server', ':tools'
}
